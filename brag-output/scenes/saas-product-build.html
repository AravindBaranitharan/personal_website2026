<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>saas-product-build</title>
<link rel="stylesheet" href="common.css">
<style>
  .logo { display: flex; align-items: center; gap: 12px; font: 700 34px/1 var(--sans); letter-spacing: -0.02em; color: #fff; }
  .logo i { width: 30px; height: 30px; border-radius: 9px; background: var(--pink); }

  /* Sign-in */
  .signin { left: 440px; top: 205px; width: 560px; height: 490px; background: var(--night-2); color: #fff; padding: 46px 50px; border: 1.5px solid #2a2a2a; }
  .signin h2 { margin: 44px 0 34px; font: 700 52px/1 var(--sans); letter-spacing: -0.02em; }
  .signin .mono { font-size: 26px; color: var(--on-night-2); }
  .field { margin-top: 14px; height: 76px; border-radius: 16px; background: #151515; border: 2px solid #333; padding: 0 24px; display: flex; align-items: center; font: 500 32px/1 var(--sans); color: #fff; }
  .caret { display: inline-block; width: 3px; height: 36px; background: var(--pink); margin-left: 2px; }
  .btn { margin-top: 30px; height: 80px; border-radius: 40px; background: var(--pink); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 14px; font: 600 32px/1 var(--sans); transform-origin: 50% 50%; }

  /* Dashboard */
  .dash { left: 60px; top: 70px; width: 920px; height: 760px; background: #181818; color: #fff; border: 1.5px solid #262626; }
  .dash .win__bar { border-bottom: 1.5px solid #262626; }
  .dash .url { margin-left: 12px; font: 400 26px/1 var(--mono); color: var(--on-night-2); letter-spacing: .02em; }
  .side { position: absolute; left: 0; top: 52px; bottom: 0; width: 250px; border-right: 1.5px solid #262626; padding: 32px 22px; }
  .side .mono { position: absolute; left: 28px; top: 120px; font-size: 26px; color: var(--on-night-2); }
  .roles { position: absolute; left: 18px; right: 18px; top: 168px; height: 210px; }
  .rpill { position: absolute; left: 0; right: 0; height: 64px; border-radius: 16px; background: rgba(209,94,255,.2); border: 2px solid var(--pink); }
  .role { position: absolute; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 18px; font: 500 30px/1 var(--sans); color: #bdbdbd; }
  .role b { width: 12px; height: 12px; border-radius: 50%; background: currentColor; opacity: .6; }
  .navbar { position: absolute; left: 28px; height: 14px; border-radius: 7px; background: #2c2c2c; }

  .main { position: absolute; left: 250px; right: 0; top: 52px; bottom: 0; padding: 34px 36px; }
  .main .mono { font-size: 26px; color: var(--pink-soft); }
  .main h2 { margin: 12px 0 0; font: 700 46px/1 var(--sans); letter-spacing: -0.02em; }
  .tile { position: absolute; top: 158px; width: 186px; height: 150px; border-radius: 20px; background: var(--night-2); border: 1.5px solid #2c2c2c; padding: 22px; transform-origin: 50% 70%; }
  .tile span { font: 500 26px/1 var(--sans); color: var(--on-night-2); }
  .tile i { position: absolute; left: 22px; bottom: 26px; height: 30px; border-radius: 8px; background: #fff; }
  .tile em { position: absolute; right: 22px; bottom: 30px; width: 22px; height: 22px; border-radius: 50%; background: var(--pink); }
  .chart { position: absolute; left: 36px; right: 36px; top: 338px; bottom: 34px; border-radius: 20px; background: var(--night-2); border: 1.5px solid #2c2c2c; padding: 22px 24px; }
  .chart span { font: 500 26px/1 var(--sans); color: var(--on-night-2); }
  .chart svg { position: absolute; left: 24px; top: 70px; }

  /* Billing */
  .bill { left: 1020px; top: 150px; width: 360px; height: 600px; background: var(--night-2); color: #fff; padding: 34px 32px; border: 1.5px solid #2a2a2a; }
  .bill h3 { margin: 0; font: 700 40px/1 var(--sans); letter-spacing: -0.02em; }
  .bill .mono { margin-top: 30px; font-size: 26px; color: var(--on-night-2); }
  .toggle { position: relative; margin-top: 14px; height: 72px; border-radius: 36px; background: #141414; border: 1.5px solid #333; }
  .tpill { position: absolute; top: 5px; width: 144px; height: 59px; border-radius: 30px; background: #fff; }
  .topt { position: absolute; top: 0; width: 148px; height: 69px; display: grid; place-items: center; font: 600 28px/1 var(--sans); }
  .plan { position: absolute; left: 32px; right: 32px; top: 252px; }
  .plan h4 { margin: 0 0 18px; font: 600 32px/1 var(--sans); }
  .feat { display: flex; align-items: center; gap: 14px; height: 44px; font: 500 26px/1 var(--sans); color: #d0d0d0; }
  .feat b { width: 12px; height: 12px; border-radius: 50%; background: var(--pink); }
  .paid { position: absolute; left: 32px; bottom: 32px; height: 60px; background: var(--pink); color: var(--ink); font-weight: 600; font-size: 30px; transform-origin: 0 50%; }
  .paid b { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--pink); display: grid; place-items: center; font-size: 20px; }

  .cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; transform-origin: 6px 4px; }
  .ripple { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 3px solid var(--pink-soft); }
</style>
</head>
<body>
<div class="stage stage--night" id="stage">
<div class="content" id="content">

  <div class="win signin" id="signin">
    <div class="logo"><i></i>acme</div>
    <h2>Sign in</h2>
    <div class="mono">Email</div>
    <div class="field" id="field"></div>
    <div class="btn" id="btn">Continue</div>
  </div>

  <div class="win dash" id="dash">
    <div class="win__bar"><span class="win__dot"></span><span class="win__dot"></span><span class="win__dot"></span><span class="url">app.acme.co</span></div>
    <div class="side" id="side">
      <div class="logo"><i></i>acme</div>
      <div class="mono">Role</div>
      <div class="roles">
        <div class="rpill" id="rpill"></div>
        <div class="role" style="top:0"><b></b>Director</div>
        <div class="role" style="top:72px"><b></b>Editor</div>
        <div class="role" style="top:144px"><b></b>Client</div>
      </div>
      <div class="navbar" style="top:440px;width:150px"></div>
      <div class="navbar" style="top:486px;width:118px"></div>
      <div class="navbar" style="top:532px;width:136px"></div>
    </div>
    <div class="main">
      <div id="head"><div class="mono">Director view</div><h2>Overview</h2></div>
      <div class="tile" style="left:36px"><span>Projects</span><i style="width:96px"></i><em></em></div>
      <div class="tile" style="left:242px"><span>Team</span><i style="width:72px"></i><em></em></div>
      <div class="tile" style="left:448px"><span>Revenue</span><i style="width:110px"></i><em></em></div>
      <div class="chart" id="chart">
        <span>Revenue · this quarter</span>
        <svg width="550" height="300" viewBox="0 0 550 300">
          <g stroke="#2c2c2c" stroke-width="2">
            <line x1="0" y1="40" x2="550" y2="40"/><line x1="0" y1="120" x2="550" y2="120"/><line x1="0" y1="200" x2="550" y2="200"/>
          </g>
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d15eff" stop-opacity=".35"/><stop offset="1" stop-color="#d15eff" stop-opacity="0"/></linearGradient></defs>
          <path id="area" d="M0 230 L70 205 L140 214 L210 168 L280 178 L350 120 L420 132 L490 74 L550 56 L550 280 L0 280 Z" fill="url(#g)"/>
          <path id="line" d="M0 230 L70 205 L140 214 L210 168 L280 178 L350 120 L420 132 L490 74 L550 56" fill="none" stroke="#de80ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle id="end" cx="550" cy="56" r="11" fill="#fff" stroke="#d15eff" stroke-width="5"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="win bill" id="bill">
    <h3>Billing</h3>
    <div class="mono">Plan</div>
    <div class="toggle">
      <div class="tpill" id="tpill"></div>
      <div class="topt" id="o1" style="left:0">Starter</div>
      <div class="topt" id="o2" style="left:148px">Team</div>
    </div>
    <div class="plan" id="p1"><h4>Starter plan</h4><div class="feat"><b></b>One role</div><div class="feat"><b></b>Basic boards</div></div>
    <div class="plan" id="p2"><h4>Team plan</h4><div class="feat"><b></b>All roles</div><div class="feat"><b></b>Shared boards</div><div class="feat"><b></b>Invoices</div></div>
    <span class="chip paid" id="paid"><b>✓</b>Paid</span>
  </div>

  <div class="ripple" id="ripple"></div>
  <svg class="cursor" id="cursor" viewBox="0 0 46 46"><path d="M6 4 L6 36 L14.5 28 L20 40 L26 37.5 L20.5 26 L32 26 Z" fill="#fff" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/></svg>
</div>
</div>
<script src="common.js"></script>
<script>
  const { seg, ease, lerp, css, rise, outro, clamp, typed } = B;
  const D = 5;
  const EMAIL = "team@acme.co";
  const tiles = [...document.querySelectorAll(".tile")];
  const roles = [...document.querySelectorAll(".role")];
  const lineEl = document.getElementById("line");
  const LEN = lineEl.getTotalLength();
  lineEl.style.strokeDasharray = String(LEN);

  // cursor keyframes [t, x, y]
  const CUR = [[0.85, 860, 760], [1.1, 740, 612], [3.2, 1300, 720], [3.45, 1268, 332], [4.0, 1290, 360]];
  function cursorAt(t) {
    if (t <= CUR[0][0]) return CUR[0].slice(1);
    for (let i = 0; i < CUR.length - 1; i++) {
      const [a, x0, y0] = CUR[i], [b, x1, y1] = CUR[i + 1];
      if (t <= b) { const k = ease.inOut(seg(t, a, b)); return [lerp(x0, x1, k), lerp(y0, y1, k)]; }
    }
    return CUR[CUR.length - 1].slice(1);
  }
  const ripple = (t, at) => seg(t, at, at + 0.4);

  window.SCENE = {
    duration: D,
    poster: 4.3,
    render(t) {
      css("#content", { opacity: String(outro(t, D)) });

      // 1. sign-in card: rise, type email, press Continue, exit
      const sIn = ease.out(seg(t, 0, 0.45));
      const sOut = ease.inOut(seg(t, 1.3, 1.55));
      css("#signin", { opacity: String(sIn * (1 - sOut)), transform: `translate3d(0, ${(1 - sIn) * 40 - sOut * 30}px, 0) scale(${1 - sOut * 0.06})` });
      const typing = t > 0.35 && t < 1.05;
      document.getElementById("field").innerHTML = typed(EMAIL, seg(t, 0.4, 0.95)).replace(/</g, "&lt;") + (typing && Math.floor(t * 5) % 2 === 0 ? '<span class="caret"></span>' : "");
      const press = Math.sin(Math.PI * seg(t, 1.1, 1.25));
      css("#btn", { transform: `scale(${1 - press * 0.05})`, background: t > 1.1 ? "var(--pink-strong)" : "var(--pink)" });
      document.getElementById("btn").textContent = t > 1.2 ? "✓ Signed in" : "Continue";

      // 2. dashboard assembles
      const dIn = ease.out(seg(t, 1.45, 1.85));
      const slide = 200 * (1 - ease.inOut(seg(t, 2.8, 3.25))); // centred until billing arrives
      css("#dash", { opacity: String(dIn), transform: `translate3d(${slide}px, ${(1 - dIn) * 50}px, 0) scale(${0.97 + 0.03 * dIn})` });
      css("#side", { opacity: String(ease.out(seg(t, 1.55, 1.85))) });
      css("#head", rise(ease.out(seg(t, 1.65, 1.95)), 20));
      // role pill settles on Director: Client → Editor → Director
      const rY = 144 - 72 * ease.inOut(seg(t, 1.8, 1.95)) - 72 * ease.inOut(seg(t, 2.08, 2.23));
      css("#rpill", { top: rY + "px", opacity: String(seg(t, 1.7, 1.85)) });
      roles.forEach((r, i) => { r.style.color = Math.abs(i * 72 - rY) < 36 ? "#ffffff" : "#bdbdbd"; });
      tiles.forEach((el, i) => {
        const k = ease.back(seg(t, 1.9 + i * 0.13, 2.25 + i * 0.13));
        css(el, { opacity: String(clamp(k * 1.5)), transform: `scale(${0.8 + 0.2 * k})` });
      });
      css("#chart", rise(ease.out(seg(t, 2.05, 2.35)), 30));
      const draw = ease.inOut(seg(t, 2.3, 3.05));
      lineEl.style.strokeDashoffset = String(LEN * (1 - draw));
      css("#area", { opacity: String(ease.out(seg(t, 2.8, 3.2))) });
      const e = ease.back(seg(t, 2.95, 3.2));
      css("#end", { opacity: String(clamp(e * 2)), transform: `scale(${e})`, transformOrigin: "550px 56px" });

      // 3. billing: slide in, click Team, Paid badge
      const bIn = ease.out(seg(t, 2.95, 3.35));
      css("#bill", { opacity: String(bIn), transform: `translate3d(${(1 - bIn) * 70}px, 0, 0)` });
      const sw = ease.inOut(seg(t, 3.5, 3.75));
      css("#tpill", { left: lerp(5, 144, sw) + "px" });
      css("#o1", { color: sw < 0.5 ? "var(--ink)" : "#bdbdbd" });
      css("#o2", { color: sw < 0.5 ? "#bdbdbd" : "var(--ink)" });
      const pOut = seg(t, 3.5, 3.62), pIn = ease.out(seg(t, 3.62, 3.85));
      css("#p1", { opacity: String(1 - pOut) });
      css("#p2", { ...rise(pIn, 16) });
      const pk = ease.back(seg(t, 3.85, 4.15));
      css("#paid", { opacity: String(clamp(pk * 1.6)), transform: `scale(${0.6 + 0.4 * pk})` });

      // cursor + click ripples
      const [cx, cy] = cursorAt(t);
      const cOn = ease.out(seg(t, 0.8, 1.0)) * (1 - seg(t, 1.25, 1.4)) + ease.out(seg(t, 3.2, 3.35)) * (1 - seg(t, 4.1, 4.3));
      const down = (t > 1.1 && t < 1.22) || (t > 3.47 && t < 3.6);
      css("#cursor", { left: cx + "px", top: cy + "px", opacity: String(cOn), transform: `scale(${down ? 0.86 : 1})` });
      const r1 = ripple(t, 1.1), r2 = ripple(t, 3.47);
      const r = r1 > 0 && r1 < 1 ? r1 : r2;
      const [rx, ry] = r1 > 0 && r1 < 1 ? [740, 612] : [1268, 332];
      css("#ripple", { left: rx + 6 + "px", top: ry + 4 + "px", opacity: String(r > 0 && r < 1 ? 1 - r : 0), transform: `scale(${0.3 + r})` });
    },
  };
  window.SCENE.render(0);
</script>
</body>
</html>
