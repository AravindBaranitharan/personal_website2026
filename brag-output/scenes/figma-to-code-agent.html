<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>figma-to-code-agent</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Agents row */
  .agents { position: absolute; left: 0; right: 0; top: 52px; display: flex; justify-content: center; align-items: center; gap: 18px; }
  .agent { background: var(--night-2); color: var(--on-night-2); }
  .agent b { width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
  .arrow { width: 40px; height: 2px; background: #3a3a3a; }

  /* Figma window */
  .figma { left: 60px; top: 150px; width: 640px; height: 660px; background: var(--night-2); color: var(--on-night); }
  .figma .win__bar { border-bottom: 1px solid #2c2c2c; }
  .figma .file { margin-left: 12px; font: 400 22px/1 var(--mono); color: var(--on-night-2); letter-spacing: .04em; }
  .layers { position: absolute; left: 0; top: 52px; bottom: 0; width: 220px; border-right: 1px solid #2c2c2c; padding: 18px 0; }
  .layer { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 22px; font: 500 24px/1 var(--sans); color: #bdbdbd; }
  .layer i { width: 18px; height: 18px; border: 2px solid currentColor; border-radius: 4px; opacity: .6; }
  .canvas { position: absolute; left: 220px; right: 0; top: 52px; bottom: 0; background: #151515; display: grid; place-items: center; }
  .design { position: relative; width: 300px; height: 500px; border-radius: 26px; background: var(--paper); overflow: hidden; }
  .d-nav { position: absolute; left: 0; right: 0; top: 0; height: 64px; background: var(--wash-pink); }
  .d-title1 { position: absolute; left: 26px; top: 104px; width: 220px; height: 30px; border-radius: 8px; background: var(--ink); }
  .d-title2 { position: absolute; left: 26px; top: 146px; width: 160px; height: 30px; border-radius: 8px; background: var(--ink); }
  .d-btn { position: absolute; left: 26px; top: 210px; width: 140px; height: 52px; border-radius: 26px; background: var(--pink); }
  .d-card { position: absolute; left: 26px; right: 26px; top: 296px; height: 170px; border-radius: 20px; background: var(--band); border: 2px solid var(--sunk); }
  .sel { position: absolute; border: 3px solid var(--pink); border-radius: 6px; pointer-events: none; }
  .sel::before, .sel::after, .sel i::before, .sel i::after { content: ""; position: absolute; width: 12px; height: 12px; background: var(--paper); border: 3px solid var(--pink); }
  .sel::before { left: -8px; top: -8px; } .sel::after { right: -8px; top: -8px; }
  .sel i::before { left: -8px; bottom: -8px; } .sel i::after { right: -8px; bottom: -8px; }

  /* Code panel */
  .code { left: 760px; top: 150px; width: 620px; height: 420px; background: #181818; color: #e6e6e6; }
  .code .win__bar { border-bottom: 1px solid #262626; }
  .code pre { margin: 0; padding: 26px 30px; font: 400 26px/1.62 var(--mono); white-space: pre; }
  .tag { color: var(--pink-soft); } .attr { color: var(--lilac); } .str { color: var(--pink); } .txt { color: #ffffff; }
  .caret { display: inline-block; width: 13px; height: 30px; background: var(--pink); vertical-align: -6px; margin-left: 2px; }

  /* Browser preview */
  .browser { left: 930px; top: 430px; width: 450px; height: 380px; background: var(--paper); color: var(--ink); }
  .browser .win__bar { background: var(--band); color: var(--ink); }
  .browser .url { margin-left: 10px; height: 30px; flex: 1; border-radius: 15px; background: var(--paper); font: 400 18px/30px var(--mono); padding: 0 14px; color: var(--muted); text-transform: lowercase; }
  .p-nav { position: absolute; left: 0; right: 0; top: 52px; height: 46px; background: var(--wash-pink); }
  .p-t1 { position: absolute; left: 30px; top: 124px; width: 260px; height: 26px; border-radius: 7px; background: var(--ink); }
  .p-t2 { position: absolute; left: 30px; top: 160px; width: 190px; height: 26px; border-radius: 7px; background: var(--ink); }
  .p-btn { position: absolute; left: 30px; top: 210px; width: 130px; height: 46px; border-radius: 23px; background: var(--pink); }
  .p-card { position: absolute; left: 30px; right: 30px; top: 278px; height: 78px; border-radius: 16px; background: var(--band); border: 2px solid var(--sunk); }

  .toast-ready { left: 760px; top: 760px; background: var(--pink); color: var(--ink); }
  .toast-ready b { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--pink); display: grid; place-items: center; font-size: 20px; }

  .dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--pink); }
</style>
</head>
<body>
<div class="stage stage--night" id="stage">
<div class="content" id="content">
  <div class="agents" id="agents">
    <span class="chip agent"><b></b>Parser</span><span class="arrow"></span>
    <span class="chip agent"><b></b>Planner</span><span class="arrow"></span>
    <span class="chip agent"><b></b>Coder</span><span class="arrow"></span>
    <span class="chip agent"><b></b>Reviewer</span>
  </div>

  <div class="win figma" id="figma">
    <div class="win__bar"><span class="win__dot"></span><span class="win__dot"></span><span class="win__dot"></span><span class="file">HOME.FIG</span></div>
    <div class="layers">
      <div class="layer" data-l="0"><i></i>Nav</div>
      <div class="layer" data-l="1"><i></i>Title</div>
      <div class="layer" data-l="2"><i></i>Button</div>
      <div class="layer" data-l="3"><i></i>Card</div>
    </div>
    <div class="canvas">
      <div class="design" id="design">
        <div class="d-nav"></div><div class="d-title1"></div><div class="d-title2"></div><div class="d-btn"></div><div class="d-card"></div>
        <div class="sel" id="sel"><i></i></div>
      </div>
    </div>
  </div>

  <div class="win code" id="code">
    <div class="win__bar"><span class="win__dot"></span><span class="win__dot"></span><span class="win__dot"></span></div>
    <pre id="pre"></pre>
  </div>

  <div class="win browser" id="browser">
    <div class="win__bar"><span class="win__dot"></span><span class="win__dot"></span><span class="win__dot"></span><span class="url">localhost:3000</span></div>
    <div class="p-nav" data-b="0"></div><div class="p-t1" data-b="1"></div><div class="p-t2" data-b="1"></div><div class="p-btn" data-b="2"></div><div class="p-card" data-b="3"></div>
  </div>

  <div class="toast toast-ready abs" id="toast"><b>✓</b>Screen ready</div>
  <div id="dots"></div>
</div>
</div>
<script src="common.js"></script>
<script>
  const { seg, ease, lerp, css, rise, outro } = B;
  const D = 5;

  // Code lines as [kind, text] tokens; typed character by character in order.
  const LINES = [
    [["tag", "<Screen>"]],
    [["txt", "  "], ["tag", "<Nav />"]],
    [["txt", "  "], ["tag", "<Title>"], ["txt", "ship it."], ["tag", "</Title>"]],
    [["txt", "  "], ["tag", "<Button "], ["attr", "tone="], ["str", "\"pink\""], ["tag", ">"]],
    [["txt", "  "], ["tag", "<Card />"]],
    [["tag", "</Screen>"]],
  ];
  const TOTAL = LINES.reduce((n, l) => n + l.reduce((m, [, s]) => m + s.length, 0) + 1, 0);

  // Selection targets inside the 300×500 design (x, y, w, h), in layer order.
  const TARGETS = [[0, 0, 300, 64], [20, 98, 232, 84], [20, 204, 152, 64], [20, 290, 260, 182]];
  const dotsEl = document.getElementById("dots");
  const DOTS = Array.from({ length: 7 }, () => { const d = document.createElement("span"); d.className = "dot"; dotsEl.appendChild(d); return d; });
  const agents = [...document.querySelectorAll(".agent")];
  const layers = [...document.querySelectorAll(".layer")];
  const blocks = [...document.querySelectorAll("[data-b]")];

  function codeHTML(chars) {
    let left = chars, html = "";
    for (const line of LINES) {
      for (const [kind, text] of line) {
        if (left <= 0) break;
        const part = text.slice(0, left); left -= part.length;
        html += `<span class="${kind}">${part.replace(/</g, "&lt;")}</span>`;
      }
      if (left <= 0) break;
      html += "\n"; left -= 1;
    }
    return html;
  }

  window.SCENE = {
    duration: D,
    poster: 4.2,
    render(t) {
      const out = outro(t, D);
      css("#content", { opacity: String(out) });

      // 1. windows enter
      const fIn = ease.out(seg(t, 0, 0.6));
      css("#figma", { opacity: String(fIn), transform: `translate3d(${(1 - fIn) * -60}px, 0, 0)` });
      const cIn = ease.out(seg(t, 1.2, 1.7));
      css("#code", { opacity: String(cIn), transform: `translate3d(${(1 - cIn) * 60}px, 0, 0)` });

      // agents light in turn
      agents.forEach((a, i) => {
        const on = seg(t, 0.7 + i * 0.75, 0.9 + i * 0.75);
        a.style.opacity = String(ease.out(seg(t, 0.15 + i * 0.08, 0.5 + i * 0.08)));
        a.style.background = on > 0.5 ? "var(--pink)" : "var(--night-2)";
        a.style.color = on > 0.5 ? "var(--ink)" : "var(--on-night-2)";
        a.style.transform = `scale(${1 + 0.06 * Math.sin(Math.PI * on)})`;
      });

      // 2. selection steps through the layers (0.75 → 1.95)
      const step = Math.min(3, Math.floor(seg(t, 0.75, 1.95) * 4));
      const within = (seg(t, 0.75, 1.95) * 4) % 1;
      const from = TARGETS[Math.max(0, step - 1)], to = TARGETS[step];
      const k = step === 0 ? 1 : ease.out(Math.min(1, within * 4));
      const box = from.map((v, i) => lerp(v, to[i], k));
      const selOn = seg(t, 0.7, 0.85) * (1 - seg(t, 2.3, 2.6));
      css("#sel", { left: box[0] + "px", top: box[1] + "px", width: box[2] + "px", height: box[3] + "px", opacity: String(selOn) });
      layers.forEach((l, i) => {
        const active = selOn > 0.2 && i === step;
        l.style.background = active ? "rgba(255,45,171,.18)" : "transparent";
        l.style.color = active ? "#ffffff" : "#bdbdbd";
      });

      // particles: design → code (1.3 → 2.9)
      DOTS.forEach((d, i) => {
        const p = seg(t, 1.3 + i * 0.16, 2.0 + i * 0.16);
        const x = lerp(560, 800, ease.inOut(p)), y = lerp(480 - i * 10, 300 + i * 22, ease.inOut(p)) - Math.sin(Math.PI * p) * 60;
        css(d, { left: x + "px", top: y + "px", opacity: String(p > 0 && p < 1 ? Math.sin(Math.PI * p) : 0) });
      });

      // 3. code types (1.5 → 3.1)
      const chars = Math.round(TOTAL * ease.inOut(seg(t, 1.5, 3.1)));
      const typing = t > 1.45 && t < 3.3;
      document.getElementById("pre").innerHTML = codeHTML(chars) + (typing && Math.floor(t * 4) % 2 === 0 ? '<span class="caret"></span>' : "");

      // 4. preview assembles (2.8 → 3.8)
      const bIn = ease.out(seg(t, 2.7, 3.1));
      css("#browser", { opacity: String(bIn), transform: `translate3d(0, ${(1 - bIn) * 50}px, 0) scale(${0.96 + 0.04 * bIn})` });
      blocks.forEach((b) => {
        const i = Number(b.dataset.b);
        const k2 = ease.back(seg(t, 3.0 + i * 0.16, 3.32 + i * 0.16));
        css(b, { opacity: String(Math.min(1, k2 * 1.4)), transform: `scale(${0.85 + 0.15 * k2})`, transformOrigin: "0 0" });
      });

      // toast
      const tk = ease.back(seg(t, 3.7, 4.05));
      css("#toast", { ...rise(Math.min(1, tk), 24), transform: `translate3d(0, ${(1 - tk) * 24}px, 0) scale(${0.9 + 0.1 * tk})` });
    },
  };
  window.SCENE.render(0);
</script>
</body>
</html>
