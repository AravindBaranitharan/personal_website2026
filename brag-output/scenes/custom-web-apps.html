<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>custom-web-apps</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Browser window: 1240×800, page coordinates below are relative to it */
  .browser { left: 100px; top: 50px; width: 1240px; height: 800px; background: var(--paper); color: var(--ink); box-shadow: 0 50px 100px -50px rgba(0,0,0,.35), 0 0 0 1px #e2e2e2; }
  .browser .win__bar { height: 64px; background: var(--band); color: var(--ink); border-bottom: 1px solid var(--line); }
  .browser .url { margin-left: 14px; width: 420px; height: 40px; border-radius: 20px; background: var(--paper); font: 400 26px/40px var(--mono); padding: 0 18px; color: var(--muted); }

  .part { position: absolute; }
  .wf { position: absolute; inset: 0; }
  .wf i { position: absolute; display: block; border-radius: 10px; background: #e6e6e6; }
  .real { position: absolute; inset: 0; }

  /* nav */
  .nav { left: 0; right: 0; top: 64px; height: 96px; }
  .nav .real { display: flex; align-items: center; padding: 0 48px; border-bottom: 1px solid var(--line); }
  .logo { font: 700 38px/1 var(--sans); letter-spacing: -0.02em; }
  .logo span { color: var(--pink); }
  .links { margin-left: auto; display: flex; align-items: center; gap: 40px; font: 500 26px/1 var(--sans); color: var(--ink-2); }
  .btn { height: 54px; padding: 0 28px; border-radius: 27px; background: var(--ink); color: var(--paper); display: inline-flex; align-items: center; font: 600 26px/1 var(--sans); }

  /* hero */
  .hero { left: 48px; top: 190px; width: 620px; height: 140px; }
  .hero .real { font: 700 62px/1.1 var(--sans); letter-spacing: -0.03em; }
  .hero .real em { font-style: normal; color: var(--pink); }

  .search { left: 48px; top: 356px; width: 600px; height: 80px; }
  .search .real { display: flex; align-items: center; gap: 18px; padding: 0 30px; border-radius: 40px; border: 2px solid var(--ink); background: var(--paper); font: 500 30px/1 var(--sans); }
  .search .spark { color: var(--pink); font-size: 32px; }
  .search .ph { color: var(--soft); }
  .caret { display: inline-block; width: 3px; height: 36px; background: var(--pink); margin-left: 2px; vertical-align: middle; }

  .results { position: absolute; left: 48px; top: 448px; width: 600px; padding: 8px; border-radius: 24px; background: var(--paper); border: 1px solid #e2e2e2; box-shadow: 0 30px 60px -30px rgba(0,0,0,.3); }
  .res { height: 58px; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-radius: 14px; font: 500 28px/1 var(--sans); color: var(--ink); }
  .res .k { font: 400 26px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); width: 96px; }
  .res mark { background: var(--pink-soft); color: var(--ink); border-radius: 8px; padding: 2px 6px; margin-left: -2px; }
  .res.top { background: var(--wash-pink); }
  .res.top .k { color: var(--pink-ink); }

  .art { left: 712px; top: 190px; width: 480px; height: 440px; }
  .art .real { border-radius: 28px; overflow: hidden; background: radial-gradient(70% 70% at 30% 30%, var(--wash-pink), transparent 70%), radial-gradient(60% 60% at 80% 80%, var(--wash-lavender), transparent 70%), var(--wash-lilac); }

  .card { top: 662px; width: 368px; height: 110px; }
  .card .real { display: flex; align-items: center; gap: 20px; padding: 0 28px; border-radius: 22px; background: var(--band); border: 2px solid var(--sunk); font: 600 30px/1 var(--sans); }
  .card .real b { width: 52px; height: 52px; border-radius: 14px; background: var(--pink-soft); flex: none; }

  /* performance ring card, floats over the hero art */
  .perf { position: absolute; left: 832px; top: 252px; width: 240px; height: 316px; border-radius: 28px; background: var(--paper); box-shadow: 0 30px 60px -30px rgba(11,11,11,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  .perf svg { width: 170px; height: 170px; }
  .perf .lbl { font: 400 26px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
  .perf .tick { position: absolute; left: 0; right: 0; top: 50px; height: 170px; display: grid; place-items: center; font: 700 64px/1 var(--sans); color: var(--pink-ink); }
</style>
</head>
<body>
<div class="stage stage--band" id="stage">
<div class="content" id="content">
  <div class="win browser" id="browser">
    <div class="win__bar"><span class="win__dot"></span><span class="win__dot"></span><span class="win__dot"></span><span class="url">localhost:3000</span></div>

    <div class="part nav" data-p="0">
      <div class="wf"><i style="left:48px; top:30px; width:130px; height:36px"></i><i style="left:700px; top:36px; width:300px; height:24px"></i><i style="right:48px; top:21px; width:124px; height:54px; border-radius:27px"></i></div>
      <div class="real"><span class="logo">acme<span>.</span></span><span class="links"><span>Product</span><span>Pricing</span><span>Docs</span><span class="btn">Start</span></span></div>
    </div>

    <div class="part hero" data-p="1">
      <div class="wf"><i style="left:0; top:6px; width:520px; height:54px"></i><i style="left:0; top:78px; width:360px; height:54px"></i></div>
      <div class="real">Software built<br>for <em>your</em> team.</div>
    </div>

    <div class="part art" data-p="2">
      <div class="wf"><i style="inset:0; border-radius:28px"></i></div>
      <div class="real"></div>
    </div>

    <div class="part search" data-p="3">
      <div class="wf"><i style="inset:0; border-radius:40px"></i></div>
      <div class="real"><span class="spark">✦</span><span id="q"></span></div>
    </div>

    <div class="part card" data-p="4" style="left:48px"><div class="wf"><i style="inset:0; border-radius:22px"></i></div><div class="real"><b></b>Dashboards</div></div>
    <div class="part card" data-p="5" style="left:436px"><div class="wf"><i style="inset:0; border-radius:22px"></i></div><div class="real"><b style="background: var(--lilac)"></b>AI search</div></div>
    <div class="part card" data-p="6" style="left:824px"><div class="wf"><i style="inset:0; border-radius:22px"></i></div><div class="real"><b style="background: var(--pink-pale)"></b>Payments</div></div>

    <div class="results" id="results">
      <div class="res top" data-r="0"><span class="k">Page</span>Pricing for <mark>teams</mark></div>
      <div class="res" data-r="1"><span class="k">Docs</span>Seats and roles</div>
      <div class="res" data-r="2"><span class="k">FAQ</span>Team billing</div>
    </div>

    <div class="perf" id="perf">
      <svg viewBox="0 0 170 170">
        <circle cx="85" cy="85" r="70" fill="none" stroke="#f4ffcc" stroke-width="14"></circle>
        <circle id="arc" cx="85" cy="85" r="70" fill="none" stroke="var(--pink)" stroke-width="14" stroke-linecap="round" transform="rotate(-90 85 85)"></circle>
        <path id="tick" d="M56 88 L76 108 L116 66" fill="none" stroke="var(--pink-ink)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span class="lbl">Performance</span>
    </div>
  </div>
</div>
</div>
<script src="common.js"></script>
<script>
  const { seg, ease, css, rise, outro, typed } = B;
  const D = 5;
  const QUERY = "pricing for teams";
  const CIRC = 2 * Math.PI * 70;

  const parts = [...document.querySelectorAll(".part")];
  const rows = [...document.querySelectorAll(".res")];
  // When each wireframe box appears, and when it snaps into its real component.
  const SHOW = [0.25, 0.32, 0.38, 0.44, 0.5, 0.55, 0.6];
  const SNAP = [0.85, 1.05, 1.25, 1.42, 1.6, 1.72, 1.84];

  window.SCENE = {
    duration: D,
    poster: 4.3,
    render(t) {
      css("#content", { opacity: String(outro(t, D)) });

      // 1. browser window enters
      const bIn = ease.out(seg(t, 0, 0.55));
      css("#browser", { opacity: String(bIn), transform: `translate3d(0, ${(1 - bIn) * 50}px, 0) scale(${0.97 + 0.03 * bIn})` });

      // 2. wireframes appear, then snap into components
      parts.forEach((p, i) => {
        const show = ease.out(seg(t, SHOW[i], SHOW[i] + 0.3));
        const snap = seg(t, SNAP[i], SNAP[i] + 0.22);
        const pop = ease.back(snap);
        css(p.querySelector(".wf"), { opacity: String(show * (1 - ease.out(Math.min(1, snap * 2.2)))) });
        css(p.querySelector(".real"), { opacity: String(Math.min(1, snap * 1.8)), transform: `scale(${0.94 + 0.06 * pop})`, transformOrigin: "0 50%" });
      });

      // 3. AI search types a query
      const k = seg(t, 2.05, 2.8);
      const q = typed(QUERY, k);
      const caret = t > 1.9 && t < 3.3 && Math.floor(t * 4) % 2 === 0 ? '<span class="caret"></span>' : "";
      document.getElementById("q").innerHTML = (q ? q : (t < 2.05 ? '<span class="ph">Ask anything</span>' : "")) + caret;

      // results drop in, top hit highlights
      const rIn = ease.out(seg(t, 2.85, 3.0));
      const rev = ease.out(seg(t, 2.85, 3.3));
      css("#results", { opacity: String(rIn), clipPath: `inset(0 0 ${((1 - rev) * 70).toFixed(2)}% 0 round 24px)` });
      rows.forEach((r, i) => {
        const rk = ease.out(seg(t, 2.88 + i * 0.1, 3.14 + i * 0.1));
        css(r, rise(rk, -16));
      });
      const hl = ease.out(seg(t, 3.25, 3.45));
      css(rows[0], { background: `rgba(244,216,254,${hl})` });
      css(rows[0].querySelector("mark"), { background: `rgba(236,184,255,${hl})` });

      // 4. performance ring fills, ✓ lands
      const pIn = ease.back(seg(t, 3.3, 3.65));
      css("#perf", { opacity: String(Math.min(1, seg(t, 3.3, 3.5))), transform: `translate3d(0, ${(1 - pIn) * 30}px, 0) scale(${0.9 + 0.1 * pIn})` });
      const fill = ease.inOut(seg(t, 3.45, 4.0));
      const arc = document.getElementById("arc");
      arc.style.strokeDasharray = CIRC;
      arc.style.strokeDashoffset = CIRC * (1 - fill);
      arc.style.opacity = fill > 0 ? "1" : "0";
      const tk = ease.back(seg(t, 3.95, 4.2));
      const tick = document.getElementById("tick");
      const TL = 92;
      tick.style.strokeDasharray = TL;
      tick.style.strokeDashoffset = TL * (1 - ease.out(seg(t, 3.92, 4.18)));
      tick.style.opacity = t >= 3.92 ? "1" : "0";
      tick.style.transformOrigin = "85px 85px";
      tick.style.transform = `scale(${0.85 + 0.15 * tk})`;
    },
  };
  B.titleCard("Service", "Custom web apps");
  window.SCENE.render(0);
</script>
</body>
</html>
