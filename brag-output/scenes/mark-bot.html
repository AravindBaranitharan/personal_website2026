<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mark-bot</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Kanban board */
  .col { position: absolute; top: 40px; width: 252px; height: 440px; border-radius: 24px; background: rgba(255,255,255,.5); border: 1.5px solid rgba(11,11,11,.07); }
  .col__head { position: absolute; left: 22px; top: 24px; display: flex; align-items: center; gap: 12px; font-size: 26px; color: var(--plum); }
  .col__head b { width: 14px; height: 14px; border-radius: 50%; background: rgba(11,11,11,.2); }
  .slot { position: absolute; left: 16px; right: 16px; top: 80px; height: 124px; border-radius: 18px; border: 2.5px dashed rgba(11,11,11,.14); }
  .ghost { position: absolute; left: 16px; right: 16px; height: 88px; border-radius: 18px; background: rgba(255,255,255,.75); }
  .ghost i { position: absolute; left: 20px; height: 14px; border-radius: 7px; background: rgba(11,11,11,.12); }
  .ghost i:nth-child(1) { top: 26px; width: 140px; } .ghost i:nth-child(2) { top: 50px; width: 90px; }

  /* Travelling reel card */
  .reel { position: absolute; left: 0; top: 0; width: 220px; height: 124px; border-radius: 18px; background: var(--paper); padding: 18px 20px; box-shadow: 0 18px 36px -22px rgba(11,11,11,.5); border: 3px solid var(--pink); transform-origin: 50% 50%; }
  .reel .mono { font-size: 26px; color: var(--pink-ink); }
  .reel h3 { margin: 10px 0 0; font: 700 30px/1 var(--sans); color: var(--plum); letter-spacing: -0.01em; }
  .reel .bar { position: absolute; left: 20px; right: 20px; bottom: 14px; height: 7px; border-radius: 4px; background: rgba(11,11,11,.08); overflow: hidden; }
  .reel .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--pink); }

  .cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; transform-origin: 6px 4px; }

  /* Script panel */
  .script { left: 54px; top: 520px; width: 800px; height: 330px; background: var(--paper); color: var(--plum); box-shadow: 0 40px 80px -46px rgba(11,11,11,.55); }
  .script .win__bar { border-bottom: 1.5px solid var(--line); color: var(--plum); }
  .script .label { margin-left: 10px; font-size: 26px; color: var(--plum); }
  .lang { margin-left: auto; height: 42px; padding: 0 18px; background: var(--wash-pink); color: var(--pink-ink); font-size: 26px; }
  .lines { padding: 28px 34px; font: 500 36px/1.55 var(--sans); white-space: pre; }
  .lines .k { color: var(--pink-ink); font-weight: 700; }
  .caret { display: inline-block; width: 4px; height: 38px; background: var(--pink); vertical-align: -7px; margin-left: 3px; }

  /* Invoice */
  .invoice { position: absolute; left: 890px; top: 520px; width: 496px; height: 150px; border-radius: 22px; background: var(--paper); padding: 26px 30px; box-shadow: 0 40px 80px -46px rgba(11,11,11,.55); }
  .invoice .mono { font-size: 26px; color: var(--muted); }
  .inv-chip { position: absolute; left: 30px; top: 72px; height: 54px; font-weight: 600; transform-origin: 0 50%; }
  .inv-wait { background: var(--sunk); color: var(--ink-2); }
  .inv-wait b { width: 22px; height: 22px; border-radius: 50%; border: 3px solid currentColor; opacity: .5; }
  .inv-done { background: var(--pink); color: var(--ink); }
  .inv-done b { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--pink); display: grid; place-items: center; font-size: 20px; }

  /* Stat */
  .stat { position: absolute; left: 890px; top: 694px; width: 496px; height: 156px; border-radius: 22px; background: var(--plum); color: #fff; padding: 26px 30px; box-shadow: 0 40px 80px -40px rgba(11,11,11,.6); }
  .stat .mono { font-size: 26px; color: var(--pink-soft); }
  .stat .big { position: absolute; left: 30px; bottom: 22px; display: flex; align-items: baseline; gap: 18px; font: 700 64px/1 var(--sans); letter-spacing: -0.02em; }
  .stat .from { color: rgba(255,255,255,.5); }
  .stat .arr { color: var(--pink-strong); }
  .stat .unit { font-size: 40px; font-weight: 600; }
</style>
</head>
<body>
<div class="stage stage--wash" id="stage">
<div class="content" id="content">
  <div id="board"></div>

  <div class="win script" id="script">
    <div class="win__bar"><span class="win__dot"></span><span class="win__dot"></span><span class="win__dot"></span><span class="label mono">Reel script</span><span class="chip lang mono">Tanglish</span></div>
    <div class="lines" id="lines"></div>
  </div>

  <div class="invoice" id="invoice">
    <div class="mono">Invoice · Diwali drop</div>
    <span class="chip inv-chip inv-wait" id="wait"><b></b>Awaiting delivery</span>
    <span class="chip inv-chip inv-done" id="done"><b>✓</b>Billed on delivery</span>
  </div>

  <div class="stat" id="stat">
    <div class="mono">Ops sync</div>
    <div class="big"><span class="from" id="s90">90</span><span class="arr" id="sarr">→</span><span id="s15">15 <span class="unit">min</span></span></div>
  </div>

  <div class="reel" id="reel"><div class="mono">Reel</div><h3>Diwali drop</h3><div class="bar"><i id="prog"></i></div></div>

  <svg class="cursor" id="cursor" viewBox="0 0 46 46"><path d="M6 4 L6 36 L14.5 28 L20 40 L26 37.5 L20.5 26 L32 26 Z" fill="#0b0b0b" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>
</div>
</div>
<script src="common.js"></script>
<script>
  const { seg, ease, lerp, css, rise, outro, clamp } = B;
  const D = 5;
  const COLS = ["Topic", "Script", "Shoot", "Edit", "Publish"];
  const GHOSTS = [2, 1, 2, 1, 1];
  const X0 = 54, STEP = 270;

  const board = document.getElementById("board");
  const cols = COLS.map((name, i) => {
    const c = document.createElement("div");
    c.className = "col";
    c.style.left = X0 + i * STEP + "px";
    let html = `<div class="col__head mono"><b></b>${name}</div><div class="slot"></div>`;
    for (let g = 0; g < GHOSTS[i]; g++) html += `<div class="ghost" style="top:${220 + g * 104}px"><i></i><i></i></div>`;
    c.innerHTML = html;
    board.appendChild(c);
    return c;
  });
  const dots = cols.map((c) => c.querySelector(".col__head b"));
  const slots = cols.map((c) => c.querySelector(".slot"));
  const ghosts = cols.map((c) => [...c.querySelectorAll(".ghost")]);

  // Card moves between columns: [start, end, from, to]
  const MOVES = [[0.85, 1.2, 0, 1], [2.45, 2.72, 1, 2], [2.82, 3.08, 2, 3], [3.18, 3.45, 3, 4]];

  // Script lines as [label, text]
  const LINES = [["Hook: ", "Machi, intha trick theriyuma?"], ["Body: ", "Simple-ah, step by step paapom."], ["CTA: ", "Follow pannunga, share pannunga!"]];
  const TOTAL = LINES.reduce((n, [a, b]) => n + a.length + b.length + 1, 0);
  function scriptHTML(chars) {
    let left = chars, html = "";
    for (const [k, txt] of LINES) {
      if (left <= 0) break;
      const a = k.slice(0, left); left -= a.length;
      html += `<span class="k">${a}</span>`;
      if (left <= 0) break;
      const b = txt.slice(0, left); left -= b.length;
      html += b;
      if (left <= 0) break;
      html += "\n"; left -= 1;
    }
    return html;
  }

  window.SCENE = {
    duration: D,
    poster: 4.3,
    render(t) {
      css("#content", { opacity: String(outro(t, D)) });

      // 1. board columns rise in
      cols.forEach((c, i) => {
        const k = ease.out(seg(t, 0.0 + i * 0.07, 0.45 + i * 0.07));
        css(c, rise(k, 36));
        ghosts[i].forEach((g, j) => css(g, { opacity: String(ease.out(seg(t, 0.25 + i * 0.07 + j * 0.08, 0.55 + i * 0.07 + j * 0.08))) }));
      });

      // card position (column index as a float) and lift while dragged
      let p = 0, lift = 0;
      for (const [a, b, f, to] of MOVES) {
        if (t >= a) p = lerp(f, to, ease.inOut(seg(t, a, b)));
        if (t > a && t < b) lift = Math.sin(Math.PI * seg(t, a, b));
      }
      const held = MOVES.some(([a, b]) => t > a - 0.08 && t < b + 0.04);
      const active = Math.round(p);
      cols.forEach((c, i) => {
        const on = t > 0.5 && i === active && lift < 0.5;
        dots[i].style.background = on ? "var(--pink)" : "rgba(11,11,11,.2)";
        c.style.background = on ? "rgba(255,255,255,.82)" : "rgba(255,255,255,.5)";
        slots[i].style.opacity = i === active && t > 0.5 ? "0" : "1";
      });

      const cIn = ease.back(seg(t, 0.3, 0.65));
      const cx = X0 + 16 + p * STEP, cy = 120 - lift * 22;
      css("#reel", {
        left: cx + "px", top: cy + "px",
        opacity: String(clamp(cIn * 1.5)),
        transform: `rotate(${lift * 3}deg) scale(${(0.8 + 0.2 * cIn) * (1 + 0.04 * lift)})`,
        boxShadow: `0 ${18 + lift * 26}px ${36 + lift * 30}px -22px rgba(11,11,11,${0.5 + lift * 0.15})`,
      });
      css("#prog", { width: ((p + 1) / 5) * 100 + "%" });

      // cursor grabs the card and drags it
      const curIn = ease.out(seg(t, 0.6, 0.85));
      const curOut = seg(t, 3.55, 3.8);
      css("#cursor", {
        left: cx + 178 + (1 - curIn) * 70 + curOut * 40 + "px",
        top: cy + 90 + (1 - curIn) * 60 + curOut * 30 + "px",
        opacity: String(curIn * (1 - curOut)),
        transform: `scale(${held ? 0.86 : 1})`,
      });

      // 2. script panel types while the card is in Script
      const sIn = ease.out(seg(t, 1.0, 1.4));
      css("#script", rise(sIn, 40));
      const chars = Math.round(TOTAL * seg(t, 1.35, 2.4));
      const typing = t > 1.3 && t < 2.55;
      document.getElementById("lines").innerHTML = scriptHTML(chars) + (typing && Math.floor(t * 5) % 2 === 0 ? '<span class="caret"></span>' : "");

      // 3. invoice waits, then bills when the card lands in Publish
      css("#invoice", rise(ease.out(seg(t, 2.5, 2.85)), 40));
      const billed = t >= 3.45 ? 1 : 0; // hard swap, no muddy cross-fade
      const pop = ease.back(seg(t, 3.45, 3.8));
      css("#wait", { opacity: String(1 - billed) });
      css("#done", { opacity: String(billed), transform: `scale(${0.85 + 0.15 * pop})` });

      // 4. stat lands
      const st = ease.back(seg(t, 3.7, 4.05));
      css("#stat", { opacity: String(clamp(st * 1.4)), transform: `translate3d(0, ${(1 - st) * 40}px, 0) scale(${0.94 + 0.06 * st})` });
      const a2 = ease.out(seg(t, 3.9, 4.2));
      css("#sarr", { opacity: String(a2), transform: `translate3d(${(1 - a2) * -20}px,0,0)` });
      css("#s15", { opacity: String(a2), transform: `translate3d(${(1 - a2) * -30}px,0,0)` });
    },
  };
  B.titleCard("Case study · markbot.in", "Mark Bot");
  window.SCENE.render(0);
</script>
</body>
</html>
